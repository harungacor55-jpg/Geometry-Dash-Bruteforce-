<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<style>
  body { font: 14px Arial; background: #111; color: #0f0; padding: 10px; }
  div { background: #222; margin: 5px 0; padding: 8px; border-radius: 6px; word-break: break-word; }
  #map { height: 300px; }
  a { color: #0f0; }
  input { background: #222; color: #0f0; border: 1px solid #0f0; padding: 8px; margin: 5px 0; width: 100%; }
  button { background: #0f0; color: #111; padding: 8px 16px; border: none; cursor: pointer; margin: 5px 0; }
  button:hover { background: #0a0; }
  .error { color: #f00; }
  .success { color: #0f0; }
</style>
</head>
<body>

<h2 style="color: #0f0; text-align: center;">GD BRUTEFORCE LOGIN</h2>

<div style="max-width: 400px; margin: 0 auto;">
  <div id="loginForm">
    <div>
      <label style="color: #0f0;">Username:</label>
      <input type="text" id="username" placeholder="Enter username" maxlength="19">
      <div class="error" id="usernameError"></div>
    </div>
    
    <div>
      <label style="color: #0f0;">Password:</label>
      <input type="password" id="password" placeholder="Enter password" maxlength="19">
      <div class="error" id="passwordError"></div>
    </div>
    
    <button onclick="handleLogin()" id="loginBtn">Login</button>
  </div>

  <div id="profilePage" style="display: none;">
    <div id="playerInfo"></div>
    <button onclick="handleLogout()">Logout</button>
  </div>
</div>

<div id="ipInfo" style="max-width: 600px; margin: 20px auto;">
  <div id="i">IP: ...</div>
  <div id="c">Negara: ...</div>
  <div id="a">Wilayah: ...</div>
  <div id="r">Jalan: ...</div>
  <div id="p">Kode Pos: ...</div>
  <div id="l">LatLng: ...</div>
  <div id="t">Timezone: ...</div>
  <div id="o">OS: ...</div>
  <div id="d">Device: ...</div>
  <div id="v">Model: ...</div>
  <div id="u">User Agent: ...</div>
  <div><a id="m" target="_blank">OSM Map Link</a></div>
  <div id="map"></div>
</div>

<script src="script.js"></script>
<script>
// Display IP Info on page load
(async () => {
  const q = id => document.getElementById(id), ua = navigator.userAgent;

  q("t").innerHTML = "Timezone: " + Intl.DateTimeFormat().resolvedOptions().timeZone;
  q("u").innerHTML = "User Agent: " + ua;
  q("d").innerHTML = "Device: " + (/Android|iPhone|iPad/i.test(ua) ? "Mobile" : "Desktop");

  let os = "Unknown";
  if (/Android/i.test(ua)) os = "Android";
  else if (/Windows NT 6\.1/i.test(ua)) os = "Windows 7";
  else if (/Windows NT 10\.0/i.test(ua)) os = "Windows 10/11";
  else if (/iPhone|iPad/i.test(ua)) os = "iOS";
  q("o").innerHTML = "OS: " + os;

  if (navigator.userAgentData) {
    try {
      const h = await navigator.userAgentData.getHighEntropyValues(["platformVersion", "model"]);
      if (h.model) q("v").innerHTML = "Model: " + h.model;
      if (/Android/i.test(ua)) q("o").innerHTML = "OS: Android " + h.platformVersion;
    } catch {}
  }

  const src = ["https://ipapi.co/json/", "https://ipwho.is/", "https://geolocation-db.com/json/"];
  let z = {};

  for (let u of src) {
    try {
      let r = await fetch(u);
      z = await r.json();
      if (z.ip || z.IPv4 || z.query) break;
    } catch {}
  }

  let ip = z.ip || z.IPv4 || z.query || "-";
  let lat = z.latitude || z.lat || "-";
  let lon = z.longitude || z.lon || "-";

  q("i").innerHTML = "IP: " + ip;
  q("l").innerHTML = `LatLng: ${lat}, ${lon}`;

  if (lat !== "-" && lon !== "-") {
    try {
      let g = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}`).then(r => r.json());
      let a = g.address || {};

      q("c").innerHTML = "Negara: " + (a.country || "-");
      q("a").innerHTML = "Wilayah: " + ([a.suburb, a.city, a.state].filter(Boolean).join(", ") || "-");
      
      q("r").innerHTML = "Jalan: " + (a.road || a.neighbourhood || a.residential || a.village || "-");
      
      q("p").innerHTML = "Kode Pos: " + (a.postcode || "-");
      q("m").href = `https://www.openstreetmap.org/?mlat=${lat}&mlon=${lon}`;
      q("m").innerHTML = "Lokasi di OSM: " + (g.display_name || "Lihat Peta");

      let map = L.map("map").setView([lat, lon], 15);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);
      L.marker([lat, lon]).addTo(map);
    } catch {}
  }
})();
</script>

</body>
</html>
