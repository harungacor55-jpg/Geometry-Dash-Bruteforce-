<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 14px Arial; background: #111; color: #0f0; padding: 10px; }
  div { background: #222; margin: 5px 0; padding: 8px; border-radius: 6px; word-break: break-word; }
  input { background: #222; color: #0f0; border: 1px solid #0f0; padding: 8px; margin: 5px 0; width: 100%; }
  button { background: #0f0; color: #111; padding: 8px 16px; border: none; cursor: pointer; margin: 5px 0; }
  button:hover { background: #0a0; }
  .error { color: #f00; }
  #map { height: 300px; }
  a { color: #0f0; }
</style>
</head>
<body>

<h2 style="color: #0f0; text-align: center;">GD BRUTEFORCE LOGIN</h2>

<div style="max-width: 400px; margin: 0 auto;">
  <div id="loginSection">
    <div>
      <label style="color: #0f0;">Username:</label>
      <input type="text" id="username" placeholder="Enter username" maxlength="19">
      <div class="error" id="usernameError"></div>
    </div>
    
    <div>
      <label style="color: #0f0;">Password:</label>
      <input type="password" id="password" placeholder="Enter password" maxlength="19">
      <div class="error" id="passwordError"></div>
    </div>
    
    <button onclick="handleLogin()" id="loginBtn">Login</button>
  </div>

  <div id="profileSection" style="display: none;">
    <div id="playerInfo"></div>
    <button onclick="handleLogout()">Logout</button>
  </div>
</div>

<div id="bruteforceSection" style="max-width: 600px; margin: 20px auto; display: none;">
  <div>
    <label style="color: #0f0;">Target Username:</label>
    <input type="text" id="targetUsername" placeholder="Target username" maxlength="19">
    <button onclick="searchTarget()">Search</button>
  </div>
  <div id="searchResult"></div>
  
  <div id="bruteforceProcess" style="display: none;">
    <div>Processing...</div>
    <div id="attemptsContainer" style="max-height: 300px; overflow-y: auto;"></div>
    <div id="statusMessage"></div>
  </div>
</div>

<script src="script.js"></script>

</body>
</html>
